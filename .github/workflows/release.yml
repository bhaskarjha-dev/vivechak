name: Release

# Publishing runs only for a pushed version tag: there is no manual dispatch, so no run can publish
# a version that is not a tag (CRIT-03).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight Credential Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Release Credentials
        run: |
          echo "=== Release Preflight Check ==="
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "::error::GITHUB_TOKEN is missing or empty"
            exit 1
          fi
          echo "✓ GITHUB_TOKEN present"
          echo "Release triggered by tag: ${{ github.ref_name }}"

          # Fail-closed credential verification (CRIT-01/CRIT-03): every publisher below needs its secret,
          # so a missing one stops the release here, before anything is published.
          MISSING=""
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            MISSING="$MISSING NPM_TOKEN"
          fi
          # PYPI_API_TOKEN: an account-scoped PyPI API token, so it covers both vivechak and vck (see the pypi job).
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            MISSING="$MISSING PYPI_API_TOKEN"
          fi
          if [ -z "${{ secrets.TAP_GITHUB_TOKEN }}" ]; then
            MISSING="$MISSING TAP_GITHUB_TOKEN"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Required secrets missing for official tag release:$MISSING"
            exit 1
          fi
          echo "✓ All publishing credentials present"

          # Fail-closed registry ownership checks: verify package endpoints respond HTTP 200
          echo "Checking registry package endpoints..."
          curl -s -f -o /dev/null https://registry.npmjs.org/vivechak || {
            echo "::error::npm package 'vivechak' is not claimed or reachable (HTTP 200 expected)"
            exit 1
          }
          echo "✓ npm vivechak endpoint verified"

          curl -s -f -o /dev/null https://pypi.org/pypi/vivechak/json || {
            echo "::error::PyPI package 'vivechak' is not claimed or reachable (HTTP 200 expected)"
            exit 1
          }
          echo "✓ PyPI vivechak endpoint verified"

          curl -s -f -o /dev/null https://pypi.org/pypi/vck/json || {
            echo "::error::PyPI package 'vck' is not claimed or reachable (HTTP 200 expected)"
            exit 1
          }
          echo "✓ PyPI vck endpoint verified"

      - name: Verify push access to the Homebrew tap and the Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          # GoReleaser pushes the cask to bhaskarjha-dev/homebrew-tap and the manifest to bhaskarjha-dev/scoop-bucket
          # with TAP_GITHUB_TOKEN only after it has published the GitHub release, so both are checked here, before
          # anything is published. A missing repository or a token that can't see it fails this step (HTTP 404).
          # permissions.push reports the token owner's role on the repository: a fine-grained token must also grant
          # "Contents: read and write" on both repositories, which this call cannot see.
          TAP_PUSH=$(gh api repos/bhaskarjha-dev/homebrew-tap --jq .permissions.push) || TAP_PUSH="unreachable"
          BUCKET_PUSH=$(gh api repos/bhaskarjha-dev/scoop-bucket --jq .permissions.push) || BUCKET_PUSH="unreachable"
          echo "bhaskarjha-dev/homebrew-tap push access: $TAP_PUSH"
          echo "bhaskarjha-dev/scoop-bucket push access: $BUCKET_PUSH"
          if [ "$TAP_PUSH" != "true" ] || [ "$BUCKET_PUSH" != "true" ]; then
            echo "::error::TAP_GITHUB_TOKEN must be able to push to bhaskarjha-dev/homebrew-tap and bhaskarjha-dev/scoop-bucket; create the missing repository or give the token access to it"
            exit 1
          fi
          echo "✓ TAP_GITHUB_TOKEN can push to bhaskarjha-dev/homebrew-tap and bhaskarjha-dev/scoop-bucket"
          echo "=== Preflight check completed ==="

  # 1. Primary Native Release (macOS runner for universal lipo + 7 OS targets + nfpms)
  goreleaser:
    name: Core GoReleaser
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Vulnerability Check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # 2. Multi-Arch Docker Container Image (Runs on Linux using GITHUB_TOKEN)
  docker:
    name: Docker GHCR
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # A prerelease tag (e.g. v0.1.0-rc.1, the rehearsal) must not move :latest.
          LATEST=()
          case "$TAG_VERSION" in
            *-*) echo "Prerelease ${TAG_VERSION}: :latest is not updated" ;;
            *) LATEST=(-t "ghcr.io/${OWNER}/vivechak:latest" -t "ghcr.io/${OWNER}/vck:latest") ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${TAG_VERSION}" \
            -t ghcr.io/${OWNER}/vivechak:${{ github.ref_name }} \
            -t ghcr.io/${OWNER}/vivechak:${TAG_VERSION} \
            -t ghcr.io/${OWNER}/vck:${{ github.ref_name }} \
            -t ghcr.io/${OWNER}/vck:${TAG_VERSION} \
            "${LATEST[@]}" \
            --push .

  # 3. npm / npx Publisher (a missing NPM_TOKEN fails this job; preflight checks it before anything is published)
  npm:
    name: npm Registry
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Synchronize npm versions from git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting npm package and runner to version: $TAG_VERSION"
          sed -i "s/\"version\": \".*\"/\"version\": \"$TAG_VERSION\"/" npm/vivechak/package.json
          sed -i "s/const VERSION = ['\"].*['\"];/const VERSION = '$TAG_VERSION';/" npm/vivechak/bin/runner.js

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          cd npm/vivechak
          # A prerelease (e.g. 0.1.0-rc.1, the rehearsal) is published under the `next` dist-tag, so it never becomes `latest`.
          case "$TAG_VERSION" in
            *-*)
              echo "Publishing vivechak ${TAG_VERSION} with dist-tag next..."
              npm publish --access public --tag next
              ;;
            *)
              echo "Publishing vivechak ${TAG_VERSION}..."
              npm publish --access public
              ;;
          esac

  # 4. PyPI / uvx Publisher (a missing PYPI_API_TOKEN fails this job; preflight checks it before anything is published)
  pypi:
    name: PyPI Registry
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize PyPI versions from git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPI_VERSION="$(TAG_VERSION="$TAG_VERSION" python -c 'import os, re; v = os.environ["TAG_VERSION"]; v = re.sub(r"-?alpha\.?", "a", v); v = re.sub(r"-?beta\.?", "b", v); v = re.sub(r"-?rc\.?", "rc", v); print(v)')"
          echo "Setting PyPI package version=$PYPI_VERSION (GitHub asset tag version=$TAG_VERSION)"
          sed -i "s/version = \".*\"/version = \"$PYPI_VERSION\"/" pypi/vivechak/pyproject.toml
          sed -i "s/version = \".*\"/version = \"$PYPI_VERSION\"/" pypi/vck/pyproject.toml
          sed -i "s/\"vivechak[=><~].*\"/\"vivechak~=$PYPI_VERSION\"/" pypi/vck/pyproject.toml
          sed -i "s/VERSION = ['\"].*['\"]/VERSION = \"$TAG_VERSION\"/" pypi/vivechak/src/vivechak/cli.py
          sed -i "s/__version__ = ['\"].*['\"]/__version__ = \"$PYPI_VERSION\"/" pypi/vivechak/src/vivechak/__init__.py
          sed -i "s/__version__ = ['\"].*['\"]/__version__ = \"$PYPI_VERSION\"/" pypi/vck/src/vck/__init__.py

      # PYPI_API_TOKEN must be an account-scoped PyPI API token (scope "Entire account (all projects)"):
      # it is the one credential for both projects, so the vck upload cannot be refused after vivechak
      # has been published (a token scoped to one project would publish vivechak, then fail on vck).
      # Both packages are built and checked before the first upload; vivechak goes first because vck
      # depends on it.
      - name: Build both PyPI packages
        run: |
          python -m pip install --upgrade build twine
          python -m build pypi/vivechak
          python -m build pypi/vck

      - name: Check both PyPI packages
        run: twine check pypi/vivechak/dist/* pypi/vck/dist/*

      - name: Publish vivechak to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive pypi/vivechak/dist/*

      - name: Publish vck to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive pypi/vck/dist/*
