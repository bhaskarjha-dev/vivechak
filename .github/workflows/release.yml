name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version override (e.g. 0.1.0)"
        required: false
        default: "0.0.0-dev"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight Credential Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify Release Credentials
        run: |
          echo "=== Release Preflight Check ==="
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "::error::GITHUB_TOKEN is missing or empty"
            exit 1
          fi
          echo "✓ GITHUB_TOKEN present"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Release triggered by tag: ${{ github.ref_name }}"

            # Fail-closed credential verification for official tag releases (CRIT-01/CRIT-03)
            MISSING=""
            if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
              MISSING="$MISSING NPM_TOKEN"
            fi
            if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
              MISSING="$MISSING PYPI_API_TOKEN"
            fi
            if [ -z "${{ secrets.TAP_GITHUB_TOKEN }}" ]; then
              MISSING="$MISSING TAP_GITHUB_TOKEN"
            fi

            if [ -n "$MISSING" ]; then
              echo "::error::Required secrets missing for official tag release:$MISSING"
              exit 1
            fi
            echo "✓ All publishing credentials present"

            # Fail-closed registry ownership checks: verify package endpoints respond HTTP 200
            echo "Checking registry package endpoints..."
            curl -s -f -o /dev/null https://registry.npmjs.org/vivechak || {
              echo "::error::npm package 'vivechak' is not claimed or reachable (HTTP 200 expected)"
              exit 1
            }
            echo "✓ npm vivechak endpoint verified"

            curl -s -f -o /dev/null https://pypi.org/pypi/vivechak/json || {
              echo "::error::PyPI package 'vivechak' is not claimed or reachable (HTTP 200 expected)"
              exit 1
            }
            echo "✓ PyPI vivechak endpoint verified"

            curl -s -f -o /dev/null https://pypi.org/pypi/vck/json || {
              echo "::error::PyPI package 'vck' is not claimed or reachable (HTTP 200 expected)"
              exit 1
            }
            echo "✓ PyPI vck endpoint verified"
          else
            echo "Triggered via workflow_dispatch (non-tag); permissive credentials mode"
            if [ -n "${{ secrets.TAP_GITHUB_TOKEN }}" ]; then
              echo "✓ TAP_GITHUB_TOKEN configured"
            else
              echo "::notice::TAP_GITHUB_TOKEN not configured"
            fi
            if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
              echo "✓ NPM_TOKEN configured"
            else
              echo "::notice::NPM_TOKEN not configured"
            fi
            if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
              echo "✓ PYPI_API_TOKEN configured"
            else
              echo "::notice::PYPI_API_TOKEN not configured"
            fi
          fi
          echo "=== Preflight check completed ==="

  # 1. Primary Native Release (macOS runner for universal lipo + 7 OS targets + nfpms)
  goreleaser:
    name: Core GoReleaser
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Vulnerability Check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # 2. Multi-Arch Docker Container Image (Runs on Linux using GITHUB_TOKEN)
  docker:
    name: Docker GHCR
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg VERSION="${TAG_VERSION}" \
              -t ghcr.io/${OWNER}/vivechak:${{ github.ref_name }} \
              -t ghcr.io/${OWNER}/vivechak:${TAG_VERSION} \
              -t ghcr.io/${OWNER}/vivechak:latest \
              -t ghcr.io/${OWNER}/vck:${{ github.ref_name }} \
              -t ghcr.io/${OWNER}/vck:${TAG_VERSION} \
              -t ghcr.io/${OWNER}/vck:latest \
              --push .
          else
            TAG_VERSION="${{ inputs.version || '0.0.0-dev' }}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg VERSION="${TAG_VERSION}" \
              -t ghcr.io/${OWNER}/vivechak:dev \
              -t ghcr.io/${OWNER}/vck:dev \
              --push .
          fi

  # 3. npm / npx Publisher (Isolated, fails safe if NPM_TOKEN absent)
  npm:
    name: npm Registry
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for NPM_TOKEN
        id: check_token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::NPM_TOKEN is not set; skipping npm package publish."
          fi

      - uses: actions/setup-node@v4
        if: steps.check_token.outputs.has_token == 'true'
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Synchronize npm versions from git tag
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION="${{ inputs.version || '0.0.0-dev' }}"
          fi
          echo "Setting npm package and runner to version: $TAG_VERSION"
          sed -i "s/\"version\": \".*\"/\"version\": \"$TAG_VERSION\"/" npm/vivechak/package.json
          sed -i "s/const VERSION = ['\"].*['\"];/const VERSION = '$TAG_VERSION';/" npm/vivechak/bin/runner.js

      - name: Publish to npm
        if: steps.check_token.outputs.has_token == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing vivechak..."
          cd npm/vivechak && npm publish --access public

  # 4. PyPI / uvx Publisher (Isolated, fails safe if PYPI_API_TOKEN absent)
  pypi:
    name: PyPI Registry
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for PYPI_API_TOKEN
        id: check_token
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::PYPI_API_TOKEN is not set; skipping PyPI package publish."
          fi

      - uses: actions/setup-python@v5
        if: steps.check_token.outputs.has_token == 'true'
        with:
          python-version: "3.11"

      - name: Synchronize PyPI versions from git tag
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION="${{ inputs.version || '0.0.0-dev' }}"
          fi
          echo "Setting PyPI packages, dependencies, and cli runner to version: $TAG_VERSION"
          sed -i "s/version = \".*\"/version = \"$TAG_VERSION\"/" pypi/vivechak/pyproject.toml
          sed -i "s/version = \".*\"/version = \"$TAG_VERSION\"/" pypi/vck/pyproject.toml
          sed -i "s/\"vivechak[=><~].*\"/\"vivechak~=$TAG_VERSION\"/" pypi/vck/pyproject.toml
          sed -i "s/VERSION = ['\"].*['\"]/VERSION = \"$TAG_VERSION\"/" pypi/vivechak/src/vivechak/cli.py
          sed -i "s/__version__ = ['\"].*['\"]/__version__ = \"$TAG_VERSION\"/" pypi/vivechak/src/vivechak/__init__.py
          sed -i "s/__version__ = ['\"].*['\"]/__version__ = \"$TAG_VERSION\"/" pypi/vck/src/vck/__init__.py

      - name: Publish to PyPI
        if: steps.check_token.outputs.has_token == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          cd pypi/vivechak && python -m build && twine upload --non-interactive dist/*
          cd ../vck && python -m build && twine upload --non-interactive dist/*
