name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # 1. Primary Native Release (macOS runner for universal lipo + 7 OS targets + nfpms)
  goreleaser:
    name: Core GoReleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # 2. Multi-Arch Docker Container Image (Runs on Linux using GITHUB_TOKEN)
  docker:
    name: Docker GHCR
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${TAG_VERSION}" \
            -t ghcr.io/${OWNER}/vivechak:${{ github.ref_name }} \
            -t ghcr.io/${OWNER}/vivechak:${TAG_VERSION} \
            -t ghcr.io/${OWNER}/vivechak:latest \
            -t ghcr.io/${OWNER}/vck:${{ github.ref_name }} \
            -t ghcr.io/${OWNER}/vck:${TAG_VERSION} \
            -t ghcr.io/${OWNER}/vck:latest \
            --push .

  # 3. npm / npx Publisher (Isolated, fails safe if NPM_TOKEN absent)
  npm:
    name: npm Registry
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for NPM_TOKEN
        id: check_token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::NPM_TOKEN is not set; skipping npm package publish."
          fi

      - uses: actions/setup-node@v4
        if: steps.check_token.outputs.has_token == 'true'
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Synchronize npm versions from git tag
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting npm packages, dependencies, and runner to version: $TAG_VERSION"
          sed -i "s/\"version\": \".*\"/\"version\": \"$TAG_VERSION\"/" npm/vivechak/package.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$TAG_VERSION\"/" npm/vck/package.json
          sed -i "s/\"vivechak\": \".*\"/\"vivechak\": \"^$TAG_VERSION\"/" npm/vck/package.json
          sed -i "s/const VERSION = ['\"].*['\"];/const VERSION = '$TAG_VERSION';/" npm/vivechak/bin/runner.js

      - name: Publish to npm
        if: steps.check_token.outputs.has_token == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing vivechak..."
          cd npm/vivechak && npm publish --access public
          echo "Publishing vck..."
          cd ../vck && npm publish --access public

  # 4. PyPI / uvx Publisher (Isolated, fails safe if PYPI_API_TOKEN absent)
  pypi:
    name: PyPI Registry
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for PYPI_API_TOKEN
        id: check_token
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::PYPI_API_TOKEN is not set; skipping PyPI package publish."
          fi

      - uses: actions/setup-python@v5
        if: steps.check_token.outputs.has_token == 'true'
        with:
          python-version: "3.11"

      - name: Synchronize PyPI versions from git tag
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting PyPI packages, dependencies, and cli runner to version: $TAG_VERSION"
          sed -i "s/version = \".*\"/version = \"$TAG_VERSION\"/" pypi/vivechak/pyproject.toml
          sed -i "s/version = \".*\"/version = \"$TAG_VERSION\"/" pypi/vck/pyproject.toml
          sed -i "s/\"vivechak[=><].*\"/\"vivechak>=$TAG_VERSION,<0.2.0\"/" pypi/vck/pyproject.toml
          sed -i "s/VERSION = ['\"].*['\"]/VERSION = \"$TAG_VERSION\"/" pypi/vivechak/src/vivechak/cli.py
          sed -i "s/__version__ = ['\"].*['\"]/__version__ = \"$TAG_VERSION\"/" pypi/vivechak/src/vivechak/__init__.py
          sed -i "s/__version__ = ['\"].*['\"]/__version__ = \"$TAG_VERSION\"/" pypi/vck/src/vck/__init__.py

      - name: Publish to PyPI
        if: steps.check_token.outputs.has_token == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          cd pypi/vivechak && python -m build && twine upload --non-interactive dist/*
          cd ../vck && python -m build && twine upload --non-interactive dist/*
