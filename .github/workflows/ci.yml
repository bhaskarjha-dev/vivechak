name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Embed Sync Check
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Verify embedded generators match root-level generators
          diff GENERATOR.md internal/embed/generators/GENERATOR.md
          diff GENERATOR-DECISION.md internal/embed/generators/GENERATOR-DECISION.md
          diff GENERATOR-COMPARISON.md internal/embed/generators/GENERATOR-COMPARISON.md
          # Verify embedded templates match root-level templates
          for f in templates/*.md; do
            base=$(basename "$f")
            diff "$f" "internal/embed/templates/$base"
          done
          echo "✓ Embed sync verified"

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -race ./...

      - name: Build
        run: go build ./cmd/vivechak/
