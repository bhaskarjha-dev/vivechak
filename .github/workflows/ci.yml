name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Embed Sync Check
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Verify embedded generators match root-level generators
          diff GENERATOR-PROJECT.md internal/embed/generators/GENERATOR-PROJECT.md
          diff GENERATOR-DECISION.md internal/embed/generators/GENERATOR-DECISION.md
          diff GENERATOR-COMPARISON.md internal/embed/generators/GENERATOR-COMPARISON.md
          # Verify embedded templates match root-level templates
          for f in templates/*.md; do
            base=$(basename "$f")
            diff "$f" "internal/embed/templates/$base"
          done
          # Verify embedded skills match root-level skills
          diff skills/vivechak/SKILL.md internal/embed/skills/SKILL.md
          # Verify embedded rules match root-level rules
          for f in templates/rules/*; do
            base=$(basename "$f")
            diff "$f" "internal/embed/rules/$base"
          done
          echo "✓ Embed sync verified"

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -race ./...

      - name: Build
        run: go build ./cmd/vivechak/

      - name: Documentation Drift Check
        if: matrix.os == 'ubuntu-latest'
        run: |
          # tools/docgen writes docs/reference/*.md, docs/hosts.md and every block generated from
          # internal/method/evidence.json (FRAMEWORK.md, README.md, docs/QUICKSTART.md, the generators,
          # skills/vivechak/SKILL.md, templates/rules/* and their internal/embed twins). Any tracked
          # file it changes is drift, so the diff covers the whole tree, not only docs/.
          go run ./tools/docgen
          git diff --exit-code

      - name: CLI Subcommands & Research Gate Verification
        shell: bash
        run: |
          go run ./cmd/vivechak version
          go run ./cmd/vivechak doctor --help
          go run ./cmd/vivechak gate --help
          # Gate each example tree, named by explicit path, on a temporary copy: the gate writes
          # research/PHASE-0-GATE.md into the tree it checks, and CI must not rewrite committed files.
          for tree in examples/dogfood; do
            copy="$RUNNER_TEMP/gate-$(basename "$tree")"
            rm -rf "$copy"
            cp -R "$tree" "$copy"
            go run ./cmd/vivechak gate --track all "$copy"
          done
          go run ./cmd/vivechak mcp-config
          if [ -n "$(git status --porcelain -- examples)" ]; then
            git status --porcelain -- examples
            echo "::error::the gate step changed files under examples/"
            exit 1
          fi

  release-dryrun:
    name: GoReleaser Dry Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke-test the linux_amd64 archive
        run: |
          VERSION="$(jq -r .version dist/metadata.json)"
          SMOKE="$RUNNER_TEMP/archive-smoke"
          mkdir -p "$SMOKE"
          tar -xzf dist/vivechak_*_linux_amd64.tar.gz -C "$SMOKE"
          "$SMOKE/vivechak" version | tee "$SMOKE/version.txt"
          grep -F "vivechak $VERSION " "$SMOKE/version.txt"
          "$SMOKE/vck" version
      - name: npm pack (dry run)
        working-directory: npm/vivechak
        run: npm pack --dry-run
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build and check both PyPI packages
        run: |
          python -m pip install --upgrade build twine
          python -m build pypi/vivechak
          python -m build pypi/vck
          twine check pypi/vivechak/dist/* pypi/vck/dist/*
      - name: Docker build and container smoke-test
        run: |
          docker build --build-arg VERSION=0.1.0-ci -t vivechak:ci .
          docker run --rm --user "$(id -u):$(id -g)" -e VIVECHAK_PROJECT_ROOT=/workspace vivechak:ci version
      - uses: cachix/install-nix-action@v32
      - name: Nix flake build and smoke-test
        run: |
          nix build .#vivechak --print-build-logs
          ./result/bin/vivechak version
          ./result/bin/vck version
