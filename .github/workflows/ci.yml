name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Embed Sync Check
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Verify embedded generators match root-level generators
          diff GENERATOR-PROJECT.md internal/embed/generators/GENERATOR-PROJECT.md
          diff GENERATOR-DECISION.md internal/embed/generators/GENERATOR-DECISION.md
          diff GENERATOR-COMPARISON.md internal/embed/generators/GENERATOR-COMPARISON.md
          # Verify embedded templates match root-level templates
          for f in templates/*.md; do
            base=$(basename "$f")
            diff "$f" "internal/embed/templates/$base"
          done
          # Verify embedded skills match root-level skills
          diff skills/vivechak/SKILL.md internal/embed/skills/SKILL.md
          # Verify embedded rules match root-level rules
          for f in templates/rules/*; do
            base=$(basename "$f")
            diff "$f" "internal/embed/rules/$base"
          done
          echo "✓ Embed sync verified"

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -race ./...

      - name: Build
        run: go build ./cmd/vivechak/

      - name: Documentation Drift Check
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run ./tools/docgen
          git diff --exit-code docs/

      - name: CLI Subcommands & Research Gate Verification
        run: |
          go run ./cmd/vivechak version
          go run ./cmd/vivechak doctor --help
          go run ./cmd/vivechak gate --help
          go run ./cmd/vivechak gate --track all
          go run ./cmd/vivechak mcp-config

  release-dryrun:
    name: GoReleaser Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
