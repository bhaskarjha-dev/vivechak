[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivechak"
version = "0.1.0"
description = "Prove decisions before code — evidence-graded research, red-teaming, and Phase 0 exit gates for AI coding agents (MCP server & CLI)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Bhaskar Jha", email = "me@bhaskarjha.dev"}]
keywords = ["mcp", "model-context-protocol", "ai-agent", "architecture", "research", "cursor", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
vivechak = "vivechak.cli:main"
vck = "vivechak.cli:main"

[project.urls]
Homepage = "https://vivechak.bhaskarjha.dev"
Repository = "https://github.com/bhaskarjha-dev/vivechak"
Documentation = "https://vivechak.bhaskarjha.dev/docs"
