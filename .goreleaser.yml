# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Vivechak GoReleaser Configuration
# 6 platform builds + macOS universal binary
version: 2

project_name: vivechak

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: vivechak-darwin-amd64
    main: ./cmd/vivechak
    binary: vivechak
    goos: [darwin]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0

  - id: vivechak-darwin-arm64
    main: ./cmd/vivechak
    binary: vivechak
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0

  - id: vivechak-linux
    main: ./cmd/vivechak
    binary: vivechak
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0

  - id: vivechak-windows
    main: ./cmd/vivechak
    binary: vivechak
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0

universal_binaries:
  - id: vivechak-darwin-universal
    ids:
      - vivechak-darwin-amd64
      - vivechak-darwin-arm64
    name_template: vivechak
    replace: true

archives:
  - id: default
    name_template: "vivechak_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: default
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    cmd: syft
    args:
      - "${artifact}"
      - --output
      - cyclonedx-json=${document}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^.*feat.*:.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix.*:.*$"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: bhaskarjha-dev
    name: vivechak
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - name: vivechak
    ids:
      - default
    repository:
      owner: bhaskarjha-dev
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/bhaskarjha-dev/vivechak
    description: Evidence-grounded research for technical decisions — MCP server
    license: MIT
    install: |
      bin.install "vivechak"
    test: |
      system "#{bin}/vivechak", "version"

scoops:
  - name: vivechak
    ids:
      - default
    repository:
      owner: bhaskarjha-dev
      name: scoop-bucket
    homepage: https://github.com/bhaskarjha-dev/vivechak
    description: Evidence-grounded research for technical decisions — MCP server
    license: MIT
