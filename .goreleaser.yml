# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Vivechak GoReleaser Configuration
# 6 platform builds + macOS universal binary
version: 2

project_name: vivechak

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: vivechak-darwin-amd64
    main: ./cmd/vivechak
    binary: vivechak
    goos: [darwin]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vivechak-darwin-arm64
    main: ./cmd/vivechak
    binary: vivechak
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vivechak-linux
    main: ./cmd/vivechak
    binary: vivechak
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vivechak-windows
    main: ./cmd/vivechak
    binary: vivechak
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vck-windows
    main: ./cmd/vivechak
    binary: vck
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vck-darwin-amd64
    main: ./cmd/vivechak
    binary: vck
    goos: [darwin]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vck-darwin-arm64
    main: ./cmd/vivechak
    binary: vck
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vck-linux
    main: ./cmd/vivechak
    binary: vck
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vivechak-freebsd
    main: ./cmd/vivechak
    binary: vivechak
    goos: [freebsd]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

  - id: vck-freebsd
    main: ./cmd/vivechak
    binary: vck
    goos: [freebsd]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Version={{.Version}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Commit={{.Commit}}
      - -X github.com/bhaskarjha-dev/vivechak/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0

universal_binaries:
  - id: vivechak-darwin-universal
    ids:
      - vivechak-darwin-amd64
      - vivechak-darwin-arm64
    name_template: vivechak
    replace: true

  - id: vck-darwin-universal
    ids:
      - vck-darwin-amd64
      - vck-darwin-arm64
    name_template: vck
    replace: true

archives:
  - id: default
    name_template: "vivechak_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

nfpms:
  - id: vivechak-linux-packages
    package_name: vivechak
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - vivechak-linux
      - vck-linux
    homepage: https://github.com/bhaskarjha-dev/vivechak
    description: Evidence-grounded research for technical decisions — MCP server
    maintainer: Bhaskar Jha <me@bhaskarjha.dev>
    license: MIT
    vendor: bhaskarjha-dev
    section: devel
    priority: optional
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/vivechak/LICENSE
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/vivechak/README.md
        file_info:
          mode: 0644
    provides:
      - vck
    conflicts:
      - vck
    replaces:
      - vck

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: default
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    cmd: syft
    args:
      - "${artifact}"
      - --output
      - cyclonedx-json=${document}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^.*feat.*:.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix.*:.*$"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: bhaskarjha-dev
    name: vivechak
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

homebrew_casks:
  - name: vivechak
    ids:
      - default
    skip_upload: "{{ if index .Env \"TAP_GITHUB_TOKEN\" }}false{{ else }}true{{ end }}"
    repository:
      owner: bhaskarjha-dev
      name: homebrew-tap
      token: "{{ if index .Env \"TAP_GITHUB_TOKEN\" }}{{ .Env.TAP_GITHUB_TOKEN }}{{ else }}{{ .Env.GITHUB_TOKEN }}{{ end }}"
    directory: Casks
    homepage: https://github.com/bhaskarjha-dev/vivechak
    description: Evidence-grounded research for technical decisions — MCP server
    license: MIT
    caveats: |
      To use on macOS, you may need to remove quarantine:
        xattr -dr com.apple.quarantine "$(brew --prefix)/Caskroom/vivechak"
    binaries:
      - vivechak
      - vck

scoops:
  - name: vivechak
    ids:
      - default
    skip_upload: "{{ if index .Env \"TAP_GITHUB_TOKEN\" }}false{{ else }}true{{ end }}"
    repository:
      owner: bhaskarjha-dev
      name: scoop-bucket
      token: "{{ if index .Env \"TAP_GITHUB_TOKEN\" }}{{ .Env.TAP_GITHUB_TOKEN }}{{ else }}{{ .Env.GITHUB_TOKEN }}{{ end }}"
    homepage: https://github.com/bhaskarjha-dev/vivechak
    description: Evidence-grounded research for technical decisions — MCP server
    license: MIT
