<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Vivechak — Prove decisions before code. Evidence-graded research, red-teaming, and Phase 0 exit gates for AI coding agents in plain Git Markdown.">
  <defs>
    <!-- Deep Obsidian Architectural Canvas -->
    <radialGradient id="bgCanvas" cx="24%" cy="46%" r="76%">
      <stop offset="0%" stop-color="#132142" />
      <stop offset="44%" stop-color="#080F20" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Quiet Saffron Radiance Behind the Truth Drop -->
    <radialGradient id="dropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2A33A" stop-opacity="0.46" />
      <stop offset="38%" stop-color="#F2A33A" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#F2A33A" stop-opacity="0" />
    </radialGradient>

    <!-- Architectural Porcelain-Paper Finish for Canonical Mark -->
    <linearGradient id="monolithFace" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="36%" stop-color="#F7F4EC" />
      <stop offset="100%" stop-color="#E2DAC8" />
    </linearGradient>

    <!-- Machined Saffron Truth Drop -->
    <radialGradient id="truthDrop" cx="34%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFCE8" />
      <stop offset="22%" stop-color="#FFD470" />
      <stop offset="62%" stop-color="#F2A33A" />
      <stop offset="100%" stop-color="#B85F08" />
    </radialGradient>

    <filter id="monolithShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#02040A" flood-opacity="0.78" />
    </filter>
  </defs>

  <!-- Base Surface -->
  <rect width="1280" height="640" fill="url(#bgCanvas)" />

