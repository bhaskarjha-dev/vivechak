    </text>
    <text x="212" y="514" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#7D8EAE" letter-spacing="1.4">
      LOCAL GO BINARY · PLAIN GIT MARKDOWN
    </text>
  </g>

