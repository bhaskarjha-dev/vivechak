      Prove decisions
    </text>
    <text y="240" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="68" font-weight="800" fill="#F2A33A" letter-spacing="-2.6">
