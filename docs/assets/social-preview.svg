        <text y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="18.5" font-weight="700" fill="#F7F4EC">Project DAG</text>
        <text y="46" font-family="'Inter', sans-serif" font-size="13.5" fill="#8C9BB6">Phase 0 Gate (G1–G12)</text>
