    </text>

    <!-- Executive + Engineer Clarity Copy -->
    <text y="302" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="#B8C4DA">
      Evidence-graded research, red-team SHA-256 checks, and human
    </text>
    <text y="332" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="#B8C4DA">
      sign-off for AI coding agents — stored locally in plain Git Markdown.
    </text>

    <!-- Three Scopes Architectural Rail (Clean Hairlines, Zero Box Clutter) -->
    <g transform="translate(0, 376)">
      <line x1="0" y1="0" x2="668" y2="0" stroke="#F4F0E6" stroke-opacity="0.12" stroke-width="1" />

      <!-- Scope 1 -->
