      <circle cx="256" cy="374.16" r="34.5" fill="none" stroke="#FFD470" stroke-opacity="0.86" stroke-width="2.4" stroke-dasharray="45 63" stroke-linecap="round" transform="rotate(-24 256 374.16)" />
      <circle cx="256" cy="374.16" r="21.6" fill="url(#truthDrop)" />
      <ellipse cx="249" cy="367" rx="5.8" ry="3.2" transform="rotate(-32 249 367)" fill="#FFFFFF" opacity="0.85" />
    </g>

